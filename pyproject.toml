[project]
name = "ai-music-curator"
version = "0.1.0"
description = "Curate and clean streaming playlists from the command line. Apple Music today, more later."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrii Vyshniak" }]
keywords = ["apple-music", "playlist", "music", "curation", "isrc"]

dependencies = [
    # Transport to Apple Music. Pinned deliberately — see deps.lock.md.
    # Never widen this constraint without reading the upstream diff first.
    "applemusic-mcp==0.18.2",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
aimc = "aimc.cli:app"

[project.urls]
Homepage = "https://github.com/avyshnya/ai-music-curator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aimc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
